name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install checksum-pinned DuckDB v2 CLI (no C++ build)
        run: |
          scripts/install-duckdb.sh
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features fault-injection -- -D warnings
      - run: cargo test --locked --all-targets --features fault-injection -- --test-threads=2
      - run: cargo run --locked --quiet --example workload -- 2000
      - run: cargo run --locked --quiet --example cloud_probe -- --local --rows=256
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: sh -n scripts/container-entrypoint.sh
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
